name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Run the test suite
        run: sbt -batch test
      - name: Check the sample data generator runs
        run: python3 sample-data/generate_claims.py --claims 50 --out /tmp/claimline-sample
